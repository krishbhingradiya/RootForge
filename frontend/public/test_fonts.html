<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'MinecraftTen';
  src: url('/assets/Minecraft.woff') format('woff');
}
body { background: #0B0F17; color: white; padding: 20px; }
.t-pixelify {
  font-family: 'Pixelify Sans', sans-serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.15;
  text-shadow: 0 3px 0 #94A3B8, 1px 5px 0 #1E293B, 2px 7px 10px rgba(0,0,0,0.9);
}
.t-silkscreen {
  font-family: 'Silkscreen', monospace;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.15;
  text-shadow: 0 3px 0 #94A3B8, 1px 5px 0 #1E293B, 2px 7px 10px rgba(0,0,0,0.9);
}
.t-minecraft {
  font-family: 'MinecraftTen', monospace;
  font-size: 34px;
  font-weight: 700;
  line-height: 1.15;
  text-shadow: 0 3px 0 #94A3B8, 1px 5px 0 #1E293B, 2px 7px 10px rgba(0,0,0,0.9);
}
.amber {
  color: #FFAA00;
  text-shadow: 0 3px 0 #D97706, 1px 5px 0 #78350F, 2px 7px 10px rgba(0,0,0,0.9);
}
</style>
</head>
<body>
<h3>1. Pixelify Sans:</h3>
<div class="t-pixelify">FROM BUSINESS CHAOS<br><span class="amber">TO A BUILDABLE</span><br><span class="amber">SOLUTION.</span></div>
<hr>
<h3>2. Silkscreen:</h3>
<div class="t-silkscreen">FROM BUSINESS CHAOS<br><span class="amber">TO A BUILDABLE</span><br><span class="amber">SOLUTION.</span></div>
<hr>
<h3>3. MinecraftTen:</h3>
<div class="t-minecraft">FROM BUSINESS CHAOS<br><span class="amber">TO A BUILDABLE</span><br><span class="amber">SOLUTION.</span></div>
</body>
</html>
